<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chi tiêu">
<meta name="theme-color" content="#fdeef4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b35" media="(prefers-color-scheme: dark)">
<title>Chi tiêu</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: dễ thương nhưng gọn gàng, như một cuốn sổ chi tiêu pastel
IDEA: sổ tay + sticker: thẻ bo tròn mập, emoji danh mục, gradient xanh-hồng
PICTURE: thẻ tổng chi gradient lớn ở đầu, biểu đồ vẽ tay bằng SVG
COLOUR and TYPE: #b5cdff #dae8ff #feabc5 #ffd4e1, chữ Nunito tròn
LAYOUT: một cột cho điện thoại, thanh tab dưới với nút + nổi
*/
:root{
  --bg1:#fdeef4;--bg2:#e9f0ff;--card:rgba(255,255,255,.78);--solid:#fff;--ink:#2b2f57;--mute:#7c82a9;--line:rgba(120,132,200,.16);
  --blue:#b5cdff;--blue2:#dae8ff;--pink:#feabc5;--pink2:#ffd4e1;--pinkInk:#d4497a;--blueInk:#4166d1;--warn:#e9a23b;
  --shadow:0 12px 30px -14px rgba(108,128,220,.45);--field:rgba(218,232,255,.55);
  --h0:rgba(181,205,255,.22);--h1:#ffe1eb;--h2:#ffc4d7;--h3:#ff9dbf;--h4:#ee6f9b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg1:#1d1d3a;--bg2:#141a35;--card:rgba(42,46,88,.78);--solid:#272b52;--ink:#eef0ff;--mute:#a0a6d2;--line:rgba(180,190,255,.13);
  --pinkInk:#ff9dbd;--blueInk:#a9c2ff;--shadow:0 12px 30px -14px rgba(0,0,0,.6);--field:rgba(181,205,255,.1);
  --h0:rgba(181,205,255,.08);--h1:#5a3b5e;--h2:#8a4a73;--h3:#c35d8d;--h4:#ff8fb6;color-scheme:dark}}
:root[data-theme=dark]{
  --bg1:#1d1d3a;--bg2:#141a35;--card:rgba(42,46,88,.78);--solid:#272b52;--ink:#eef0ff;--mute:#a0a6d2;--line:rgba(180,190,255,.13);
  --pinkInk:#ff9dbd;--blueInk:#a9c2ff;--shadow:0 12px 30px -14px rgba(0,0,0,.6);--field:rgba(181,205,255,.1);
  --h0:rgba(181,205,255,.08);--h1:#5a3b5e;--h2:#8a4a73;--h3:#c35d8d;--h4:#ff8fb6;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font:16px/1.5 Nunito,ui-rounded,system-ui,sans-serif;overflow-x:clip;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 110px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 14px}
.mon{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mon b{font-weight:800;padding:0 8px;font-size:15px;white-space:nowrap}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--mute)}
.ib:active{background:var(--field)}
.hi{font-weight:900;font-size:22px;line-height:1.1}
.sync{white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);font-weight:700;background:var(--card);padding:8px 12px;border-radius:999px;box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa}
.dot.ok{background:#4fcf95}.dot.pending{background:var(--warn)}.dot.err{background:#ff5b7f}.dot.busy{background:var(--blueInk);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:14px}
.ct{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-weight:900;font-size:17px}
.ct a,.lnk{font-size:14px;font-weight:800;color:var(--blueInk)}
.hero{background:linear-gradient(135deg,var(--g1) 0%,var(--blue2) 45%,var(--pink) 100%);color:#262a52;border-radius:28px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 18px 36px -16px rgba(150,140,230,.7)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.35)}
.hero:before{width:150px;height:150px;right:-40px;top:-50px}.hero:after{width:70px;height:70px;right:60px;bottom:-30px}
.hero small{font-weight:800;opacity:.75;font-size:14px}
.big{font-size:clamp(32px,10vw,44px);font-weight:900;line-height:1.1;margin:2px 0 10px;letter-spacing:-.5px;position:relative;z-index:1}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.hrow div{background:rgba(255,255,255,.55);border-radius:16px;padding:8px 12px}
.hrow span{display:block;font-size:12px;font-weight:800;opacity:.7}
.hrow b{font-size:16px;font-weight:900}
.chip{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.6);position:relative;z-index:1}
.chip.up{color:#c23a6b}.chip.down{color:#2f6b4f}
.brow{margin:10px 0}
.bh{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;margin-bottom:5px}
.bh span:last-child{color:var(--mute)}.bh b{color:var(--ink)}
.track{height:12px;border-radius:99px;background:var(--field);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--g1));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track i.warn{background:linear-gradient(90deg,#ffd58a,var(--warn))}.track i.over{background:linear-gradient(90deg,var(--pink),#f0608f)}
.wals{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.wals::-webkit-scrollbar{display:none}
.wal{flex:none;width:150px;background:var(--solid);border-radius:20px;padding:12px;border:1px solid var(--line)}
.wal .e{font-size:22px}.wal span{display:block;font-size:13px;color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wal b{font-weight:900}
.tx{position:relative;overflow:hidden;border-radius:18px}
.txi{display:flex;align-items:center;gap:12px;padding:10px 6px;background:var(--solid);position:relative;z-index:1;transition:transform .25s;border-radius:18px}
.card .txi{background:transparent}.card .tx{border-radius:0}
.acts{position:absolute;inset:0 0 0 auto;display:flex;z-index:0}
.acts button{width:72px;font-weight:800;font-size:14px;color:#fff}
.acts .ed{background:var(--g1)}.acts .de{background:#f0608f}
.ce{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.tm{flex:1;min-width:0}.tm b{display:block;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:900;font-size:15px}.amt.inc{color:#2fa673}.amt.exp{color:var(--pinkInk)}
:root[data-theme=dark] .amt.inc{color:#7fe0b2}
@media (prefers-color-scheme:dark){.amt.inc{color:#7fe0b2}}
.dh{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mute);margin:16px 6px 6px}
.list{background:var(--solid);border-radius:22px;padding:4px 0;box-shadow:var(--shadow);overflow:hidden}.list .txi{border-radius:0;padding:10px 14px}.list .tx{border-radius:0}
a{text-decoration:none}
.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--solid);padding:2px 0 calc(env(safe-area-inset-bottom) + 18px);margin-bottom:calc(-18px - env(safe-area-inset-bottom));z-index:2}
.empty{text-align:center;color:var(--mute);font-weight:700;padding:24px 10px}
.empty svg{display:block;margin:0 auto 8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(530px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:26px;box-shadow:0 14px 34px -12px rgba(100,110,200,.5);padding:6px;z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:800;color:var(--mute);padding:6px 0;border-radius:18px;min-height:50px;justify-content:center}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--blueInk);background:var(--field)}
nav .fab{width:60px;height:60px;margin:-28px auto 0;border-radius:22px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:34px;font-weight:700;box-shadow:0 10px 22px -6px rgba(240,120,170,.7);line-height:1}
nav .fab:active,.btn:active,.key:active{transform:scale(.94)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{padding:9px 6px;border-radius:12px;font-weight:800;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 4px 10px -4px rgba(100,110,200,.4)}
.seg.ty button.on.e{color:var(--pinkInk)}.seg.ty button.on.i{color:#2fa673}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.info{font-size:14px;color:var(--mute);font-weight:700;margin:-4px 0 8px}.info b{color:var(--ink)}
.donut{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;align-items:center}
@media(max-width:400px){.donut{grid-template-columns:1fr}.donut .dsvg{max-width:200px;margin:0 auto}}
.dsvg{position:relative;aspect-ratio:1}.dsvg svg{width:100%;height:100%}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dc span{font-size:12px;color:var(--mute);font-weight:800}.dc b{font-size:18px;font-weight:900}
.leg button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 4px;border-radius:12px;text-align:left;font-size:14px;font-weight:700}
.leg button:active{background:var(--field)}
.leg i{width:12px;height:12px;border-radius:4px;flex:none}.leg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.leg em{font-style:normal;color:var(--mute);font-size:12px;font-weight:800;width:34px;text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:11px;font-weight:800;color:var(--mute)}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--h0);font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cal button small{font-size:9px;font-weight:800;opacity:.8}
.cal .l1{background:var(--h1)}.cal .l2{background:var(--h2)}.cal .l3{background:var(--h3);color:#fff}.cal .l4{background:var(--h4);color:#fff}
.cal .td{outline:2.5px solid var(--blueInk);outline-offset:1px}
.cal .fu{opacity:.35}
.scale{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--mute);font-weight:800;margin-top:10px}
.scale i{width:14px;height:14px;border-radius:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--field);border-radius:18px;padding:12px}
.kpi span{display:block;font-size:12px;font-weight:800;color:var(--mute)}.kpi b{font-size:17px;font-weight:900}.kpi small{display:block;font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.inp,select.inp{width:100%;min-height:46px;border-radius:15px;border:1.5px solid transparent;background:var(--field);padding:10px 14px;outline:none;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.inp:focus{border-color:var(--blue)}
.srch{margin-bottom:8px}
.grp{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.grp h3{margin:0;padding:14px 16px 4px;font-size:13px;color:var(--mute);font-weight:800}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;font-weight:700;border-top:1px solid var(--line)}
.grp h3+.row{border-top:0}
.row .ri{width:34px;height:34px;border-radius:11px;background:var(--field);display:grid;place-items:center;font-size:18px;flex:none}
.row span{flex:1}.row em{font-style:normal;color:var(--mute);font-size:14px}
.row:active{background:var(--field)}
.row.danger{color:#e2456f}
#scrim{position:fixed;inset:0;background:rgba(30,30,60,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#sheet{visibility:hidden;position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:92dvh;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);background:var(--solid);border-radius:28px 28px 0 0;z-index:41;display:flex;flex-direction:column;box-shadow:0 -10px 40px -10px rgba(80,80,160,.4)}
body.sh #scrim{opacity:1;pointer-events:auto}body.sh #sheet{transform:translate(-50%,0);visibility:visible}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
#sheetHead{display:flex;align-items:center;gap:6px;padding:6px 10px 4px;flex:none}
#sheetHead h2{flex:1;margin:0;font-size:18px;font-weight:900;text-align:center}
#sheetBody{overflow-y:auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 18px);overscroll-behavior:contain}
.amtd{text-align:center;font-size:clamp(32px,10vw,42px);font-weight:900;padding:0;letter-spacing:-.5px}
.amtd.e{color:var(--pinkInk)}.amtd.i{color:#2fa673}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;border-radius:14px;font-size:11px;font-weight:800;color:var(--mute);border:2px solid transparent;line-height:1.2;text-align:center}
.cat i{font-style:normal;font-size:21px;width:40px;height:40px;border-radius:15px;display:grid;place-items:center}
.cat span{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.on{border-color:var(--blue);color:var(--ink);background:var(--field)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:9px 14px;border-radius:999px;background:var(--field);font-weight:800;font-size:14px;border:2px solid transparent;white-space:nowrap}
.chips button.on{border-color:var(--blue);background:var(--solid)}
.two{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px;margin:10px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.key{height:48px;border-radius:16px;background:var(--field);font-size:22px;font-weight:800;transition:transform .1s}
.btn{display:block;width:100%;min-height:52px;border-radius:18px;font-weight:900;font-size:17px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;margin-top:12px;box-shadow:0 10px 20px -10px rgba(240,120,170,.8);transition:transform .1s}
.btn.ghost{background:var(--field);color:var(--ink);box-shadow:none}
.btn.red{background:transparent;color:#e2456f;box-shadow:none;margin-top:4px}
.btn:disabled{opacity:.5}
label.f{display:block;font-size:13px;font-weight:800;color:var(--mute);margin:12px 2px 6px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:12px;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.note{font-size:13px;color:var(--mute);font-weight:700;margin:8px 2px}
.tog{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin:14px 2px}
.tog button{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.tog button:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tog button.on{background:var(--g1)}.tog button.on:after{transform:translateX(20px)}
#gate{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--bg1),var(--bg2));display:none;overflow-y:auto}
body.gated #gate{display:block}body.gated nav,body.gated #app{display:none}
#oops{display:none;position:fixed;left:12px;right:12px;bottom:120px;z-index:99;background:#fff;color:#b0234f;border:2px solid #feabc5;border-radius:16px;padding:12px;font:600 13px/1.4 ui-monospace,monospace;word-break:break-word}
.gw{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 22px calc(env(safe-area-inset-bottom) + 30px);text-align:center}
.gw h1{font-size:28px;font-weight:900;margin:14px 0 4px;line-height:1.15;text-wrap:balance}
.gw p{color:var(--mute);font-weight:700;margin:0 0 20px}
.gw .inp{margin-bottom:10px;text-align:left}
.logo{width:96px;height:96px;border-radius:28px;box-shadow:0 16px 30px -12px rgba(200,130,200,.7)}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 26px;min-height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--blue);transition:all .15s}
.dots i.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pk{display:grid;grid-template-columns:repeat(3,76px);gap:16px;justify-content:center}
.pk button{height:76px;border-radius:50%;background:var(--card);font-size:28px;font-weight:800;box-shadow:var(--shadow)}
.pk button:active{background:var(--blue2)}
.pk .nk{background:none;box-shadow:none;font-size:16px;color:var(--mute)}
.err{color:#e2456f;font-weight:800;font-size:14px;min-height:20px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:var(--solid);color:var(--ink);padding:12px 18px;border-radius:18px;font-weight:800;font-size:15px;box-shadow:0 12px 30px -10px rgba(80,90,180,.5);z-index:80;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px);text-align:center}
#toast{visibility:hidden}#toast.show{transform:translate(-50%,0);visibility:visible}
.banner{display:flex;gap:10px;align-items:center;background:var(--pink2);color:#7a2447;border-radius:18px;padding:10px 14px;font-weight:800;font-size:14px;margin-bottom:14px}
.demo{background:var(--blue2);color:#2a3f86}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
textarea.inp{min-height:140px;font-size:12px;font-family:ui-monospace,monospace}
/* ---- linh vật Bông ---- */
